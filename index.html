<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PlanetUp</title>
  <meta name="description" content="Retos ecológicos diarios: sube de nivel y cuida el planeta.">
  <meta name="theme-color" content="#04070D">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PlanetUp">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="preload" href="img/earth/day.jpg" as="image">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-pantalla="bienvenida">
  <!-- Fondo: la Tierra real girando (js/globe.js) -->
  <canvas id="space" aria-hidden="true"></canvas>
  <div class="velo" aria-hidden="true"></div>

  <main id="main"></main>

  <nav id="tabs" class="tabs" hidden></nav>

  <!-- Capas flotantes -->
  <div id="sheet" class="sheet" hidden></div>
  <div id="overlay" class="overlay" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <canvas id="fx" aria-hidden="true"></canvas>

  <!-- Brillo compartido para las caras del ánimo -->
  <svg width="0" height="0" style="position:absolute"><defs>
    <radialGradient id="brilloCara" cx="35%" cy="28%" r="70%"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".18"/></radialGradient>
  </defs></svg>

  <!-- El orden importa: datos → guardado → cálculos → efectos → pantallas → arranque -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/logic.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/social.js"></script>
  <script src="js/tarjeta.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
  <script type="module" src="js/globe.js"></script>
</body>
</html>
